name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE_NAME: siamatic/lims-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker.io/${{ env.IMAGE_NAME }}:latest

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: efangly/thanes-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Bump image tag
        run: |
          sed -i "s|image: docker.io/${{ env.IMAGE_NAME }}:.*|image: docker.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}|" backend/03-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/03-deployment.yaml
          git commit -m "chore: bump backend image to ${{ github.ref_name }}" || exit 0
          git push

  notify-telegram:
    needs: [build-and-push, update-gitops]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ] && [ "${{ needs.update-gitops.result }}" = "success" ]; then
            STATUS="✅ Release succeeded"
          else
            STATUS="❌ Release failed"
          fi
          TEXT="${STATUS}
          repo: ${{ github.repository }}
          version: ${{ github.ref_name }}
          image: docker.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${TEXT}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Telegram API response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Telegram notification failed (HTTP $HTTP_CODE)"
            exit 1
          fi
