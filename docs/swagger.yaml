      - description: ไฟล์เวอร์ชันใหม่
        in: formData
        name: file
        required: true
        type: file
      - description: หมายเหตุการเปลี่ยนแปลง
        in: formData
        name: change_note
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
