              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: ประวัติการแก้ไขเอกสาร
      tags:
      - documents
  /documents/{id}/lock:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: สถานะล็อค
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_document.LockRequest'
      produces:
