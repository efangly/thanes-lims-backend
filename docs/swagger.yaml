info:
  contact: {}
  description: REST API สำหรับ Thanes LIMS backend (Auth, Sample/Chain-of-Custody,
    Test Result, Equipment, Inventory/Purchase Order, Document, Environment, Notification,
    Audit)
  title: Thanes LIMS Backend API
  version: "1.0"
paths:
  /audit/export:
    get:
      description: เฉพาะ admin/qa เท่านั้น รองรับกรองช่วงเวลาด้วย `from`/`to` (RFC3339
        หรือ YYYY-MM-DD)
      parameters:
      - description: วันที่เริ่มต้น (RFC3339 หรือ YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: วันที่สิ้นสุด (RFC3339 หรือ YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: ส่งออก audit log เป็น PDF
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: ตรวจสอบอีเมล/รหัสผ่าน แล้วคืน access/refresh token pair
      parameters:
      - description: อีเมลและรหัสผ่าน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_http_user.TokenPairResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      summary: เข้าสู่ระบบ
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: เพิกถอน refresh token ที่ระบุ
      parameters:
      - description: Refresh token ที่ต้องการเพิกถอน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      summary: ออกจากระบบ
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: แลก refresh token เก่าเป็น access/refresh token pair ใหม่
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_http_user.TokenPairResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      summary: ต่ออายุ token
      tags:
      - auth
  /documents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_adapters_http_document.DocumentResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: รายการเอกสารทั้งหมด
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: ไฟล์เอกสาร
        in: formData
        name: file
        required: true
        type: file
      - description: ชื่อเอกสาร
        in: formData
        name: name
        required: true
        type: string
      - description: ประเภทเอกสาร
        in: formData
        name: type
        required: true
        type: string
      - description: ระดับการเข้าถึง
        in: formData
        name: access_level
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_http_document.DocumentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: อัปโหลดเอกสารใหม่
      tags:
      - documents
  /documents/{id}:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
