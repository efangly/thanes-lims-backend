      security:
      - BearerAuth: []
      summary: ดึงข้อมูลเอกสารตาม ID
      tags:
      - documents
  /documents/{id}/download:
    get:
      description: คืน pre-signed URL สำหรับดาวน์โหลดไฟล์จาก object storage
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: ขอลิงก์ดาวน์โหลดเอกสาร
      tags:
      - documents
  /documents/{id}/history:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_adapters_http_document.HistoryResponse'
