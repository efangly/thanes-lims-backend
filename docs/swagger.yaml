info:
  contact: {}
  description: REST API สำหรับ Thanes LIMS backend (Auth, Sample/Chain-of-Custody,
    Test Result, Equipment, Inventory/Purchase Order, Document, Environment, Notification,
    Audit)
  title: Thanes LIMS Backend API
  version: "1.0"
paths:
  /audit/export:
    get:
      description: เฉพาะ admin/qa เท่านั้น รองรับกรองช่วงเวลาด้วย `from`/`to` (RFC3339
        หรือ YYYY-MM-DD)
      parameters:
      - description: วันที่เริ่มต้น (RFC3339 หรือ YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: วันที่สิ้นสุด (RFC3339 หรือ YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: ส่งออก audit log เป็น PDF
      tags:
      - audit
  /audit/logs:
    get:
      description: รองรับกรองด้วย `actor_id`, `resource`, `method`, `from`, `to` และแบ่งหน้าด้วย
        `page`/`limit`
      parameters:
      - description: กรองตาม Actor ID
        in: query
        name: actor_id
        type: integer
      - description: กรองตาม resource
        in: query
        name: resource
        type: string
      - description: กรองตาม HTTP method
        in: query
        name: method
        type: string
      - description: วันที่เริ่มต้น (RFC3339 หรือ YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: วันที่สิ้นสุด (RFC3339 หรือ YYYY-MM-DD)
        in: query
        name: to
        type: string
      - default: 1
        description: หน้า
        in: query
        name: page
        type: integer
      - default: 50
        description: จำนวนต่อหน้า
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_adapters_http_audit.EntryResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: รายการ audit log (JSON)
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: ตรวจสอบอีเมล/รหัสผ่าน คืน access token ใน body และตั้ง refresh
        token เป็น httpOnly cookie
      parameters:
      - description: อีเมลและรหัสผ่าน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_http_user.AccessTokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      summary: เข้าสู่ระบบ
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: เพิกถอน refresh token ของ session ปัจจุบัน (จาก cookie หรือ body)
        แล้วล้าง cookie
      parameters:
      - description: Refresh token ที่ต้องการเพิกถอน (ใช้เมื่อไม่มี cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_adapters_http_user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      summary: ออกจากระบบ
      tags:
      - auth
  /auth/logout-all:
    post:
      description: เพิกถอน refresh token ของทุก session ของผู้ใช้ปัจจุบัน แล้วล้าง
        cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: ออกจากระบบทุกอุปกรณ์
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: แลก refresh token เก่า (จาก cookie หรือ body) เป็น access token
        ใหม่ และหมุน refresh token cookie
      parameters:
      - description: Refresh token (ใช้เมื่อไม่มี cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_adapters_http_user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_http_user.TokenPairResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_efangly_thanes-lims-backend_internal_adapters_http_response.Envelope'
      summary: ต่ออายุ token
      tags:
      - auth
  /calibration-results:
    get:
      description: รายการผลสอบเทียบข้ามทุกอุปกรณ์ พร้อม search bar (requirement 2.2.1)
      parameters:
      - description: ค้นหา (รหัส/ชื่ออุปกรณ์, ผู้สอบเทียบ, ประเภท, หมายเหตุ)
        in: query
        name: q
        type: string
      - description: กรองตามอุปกรณ์
        in: query
        name: equipment_id
        type: string
      - description: pass หรือ fail
        in: query
        name: result
        type: string
      - description: วันสอบเทียบตั้งแต่ (RFC3339)
        in: query
        name: from
        type: string
      - description: วันสอบเทียบถึง (RFC3339)
        in: query
        name: to
